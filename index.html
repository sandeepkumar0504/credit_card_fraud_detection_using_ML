<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Credit Card Fraud Detection</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>💳 Credit Card Fraud Detection</h1>

        <p class="subtitle">
            AI Powered Fraud Analysis System
        </p>

        <!-- MANUAL FORM -->

        <form action="/predict" method="post">

            <div class="grid">

                <input type="number"
                       step="0.01"
                       name="amount"
                       placeholder="Transaction Amount"
                       required>

                <input type="number"
                       name="time"
                       placeholder="Transaction Time"
                       required>

                <select name="transaction_type">

                    <option value="0">Online Payment</option>
                    <option value="1">ATM Withdrawal</option>
                    <option value="2">Shopping</option>
                    <option value="3">Money Transfer</option>

                </select>

                <select name="international">

                    <option value="0">Domestic Transaction</option>
                    <option value="1">International Transaction</option>

                </select>

                <select name="merchant_risk">

                    <option value="0">Trusted Merchant</option>
                    <option value="1">Medium Risk Merchant</option>
                    <option value="2">High Risk Merchant</option>

                </select>

            </div>

            <button type="submit">

                Analyze Transaction

            </button>

        </form>


        <!-- CSV UPLOAD -->

        <div class="upload-section">

            <h2>Upload CSV File</h2>

            <form action="/upload"
                  method="post"
                  enctype="multipart/form-data">

                <input type="file"
                       name="file"
                       required>

                <button type="submit">

                    Upload & Analyze CSV

                </button>

            </form>

        </div>


        <!-- RESULT -->

        {% if prediction_text %}

        <div class="result">

            {{ prediction_text }}

        </div>

        {% endif %}

    </div>

</div>

</body>
</html>
